name: TagLab extension tests
on:
  push:
    branches: ["taglab/podcast-review", "develop"]
    paths: ["examples/taglab/**", "argilla/**", ".github/workflows/**"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install the fork SDK and test dependencies
        working-directory: examples/taglab
        run: python -m pip install -r requirements-lock.txt
      - name: Test SDK extension and companion workbench
        working-directory: examples/taglab
        run: python -m pytest tests workbench -q
