<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TagLab · 内容标签实验台</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#17243b;font:16px/1.65 'Segoe UI','Microsoft Yahei',sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid #d3ddea;background:white;border-radius:8px;padding:8px 14px;color:#2457d6}button:hover{background:#edf2ff}button.primary{background:#2457d6;color:white}aside{width:210px;position:fixed;inset:0 auto 0 0;background:white;border-right:1px solid #e0e6ef;padding:28px 20px}aside h1{font-size:25px;margin:0 0 4px}small,.muted{color:#65748b}nav{display:grid;gap:12px;margin-top:40px}nav button{text-align:left;border:0;color:#17243b}nav button.active{background:#eaf0ff;color:#2457d6}main{margin-left:210px;padding:30px;max-width:1600px}h2{font-size:28px;margin:0 0 6px}h3{margin-top:0}.top{margin-bottom:24px}.stats{display:flex;gap:15px;margin:24px 0;flex-wrap:wrap}.stat,.panel{background:white;border:1px solid #e0e6ef;border-radius:10px;padding:22px}.stat{flex:1;min-width:140px}.stat strong{display:block;font-size:28px}.grid{display:grid;grid-template-columns:300px 1fr;gap:20px}.list{max-height:75vh;overflow:auto}.item{display:block;text-align:left;width:100%;color:#17243b;border:0;border-bottom:1px solid #e0e6ef;border-radius:0;padding:15px 8px}.item.selected{background:#edf2ff}.badge{display:inline-block;font-size:12px;color:#11766c;background:#e9f5f0;padding:2px 7px;border-radius:5px}.warn{background:#fff6e7;color:#925b16;padding:14px;border-left:3px solid #d99d38;margin:16px 0}textarea{width:100%;min-height:160px;padding:12px;border:1px solid #ccd6e5;border-radius:6px}input[type=text],select{padding:8px;border:1px solid #ccd6e5;border-radius:6px;max-width:100%}label{display:block;margin:12px 0 5px}label.inline{display:inline-block;margin-right:16px}.evidence{width:100%;margin:5px 0 8px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f5f7fb;padding:14px;font-size:13px}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:12px;border-bottom:1px solid #e0e6ef;vertical-align:top}a{color:#2457d6;overflow-wrap:anywhere}.actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:18px}#toast{position:fixed;bottom:20px;right:25px;background:#17243b;color:white;padding:12px 20px;border-radius:8px;display:none;max-width:75vw}details{margin:14px 0}summary{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #6c95f7;outline-offset:2px}@media(max-width:900px){aside{position:static;width:100%;padding:15px}nav{display:flex;margin-top:15px;flex-wrap:wrap}main{margin:0;padding:16px}.grid{grid-template-columns:1fr}.list{max-height:280px}}
</style><aside><h1>▥ TagLab</h1><small>内容标签实验台 / 本地试验版</small><nav><button data-view="overview">数据概览</button><button data-view="annotation">人工试标</button><button data-view="experiments">策略对比</button><button data-view="guide">标签规范</button><button data-view="model">模型实验</button></nav><p class="muted" style="margin-top:45px;font-size:13px">真实 RSS 文字样本<br>不读取音频、不推断听感<br>人工标注与机器建议分开</p></aside><main id="main"></main><div id="toast" role="status"></div>
<script>
let state,view='overview',selected=null,filter='',splitFilter='',exp=null;
const $=s=>document.querySelector(s),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const names={pilot:'试标集',dev:'开发集',test:'留出测试集'};
async function api(path,body){let r=await fetch('/api/'+path,body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{});let d=await r.json();if(!r.ok)throw Error(d.error||'请求失败');return d}
function toast(t){$('#toast').textContent=t;$('#toast').style.display='block';setTimeout(()=>$('#toast').style.display='none',5000)}
async function load(){state=await api('state');render()}
function render(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===view));({overview,annotation,experiments,guide,model}[view])()}
function head(title,desc){return `<header class="top"><small>工作空间 / ${esc(title)}</small><h2>${title}</h2><div class="muted">${desc}</div></header>`}
function overview(){let s=state.stats;$('#main').innerHTML=head('先建立可信的标签，再比较策略','把资料、人工判断和机器实验放到同一条可追溯流程中。')+`<div class="stats">${[['真实文字样本',s.records],['人工已标',s.reviewed],['待复核参考',s.reference_needs_review],['保存的实验',s.experiments]].map(([t,v])=>`<div class="stat">${t}<strong>${v}</strong></div>`).join('')}</div><section class="panel"><h3>本轮数据范围</h3><table><tr><th>来源节目</th><th>样本量</th></tr>${Object.entries(s.shows).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${v}</td></tr>`).join('')}</table><p>试标集 ${s.splits.pilot} 条 · 开发集 ${s.splits.dev} 条 · 留出集 ${s.splits.test} 条</p><div class="warn">这批样本集中在科技与商业，不能代表所有播客类型。其他来源采集曾超时，未计入有效样本。尚无人工参考时，任何策略结果都只算建议。</div><p>下一步：先在试标集核对清洗结果、独立标注主题与节目形式，记录争议，再调整规范。开发集用于改进策略；最终锁定留出集进行验收。</p><button class="primary" id="start">开始人工试标</button></section>`;$('#start').onclick=()=>{view='annotation';splitFilter='pilot';render()}}
function annotation(){let rr=state.records.filter(r=>(!splitFilter||r.split===splitFilter)&&(!filter||(r.episode_title+r.show_title).toLowerCase().includes(filter.toLowerCase())));let r=rr.find(r=>r.record_id===selected)||rr[0];selected=r?.record_id;$('#main').innerHTML=head('人工试标','先独立判断再看策略差异。原文引用只能验证出处，仍需人工判断是否支持标签。')+`<div class="actions"><input id="search" aria-label="搜索标题" placeholder="搜索标题或节目" value="${esc(filter)}"><select id="split" aria-label="数据分组"><option value="">全部分组</option>${Object.entries(names).map(([k,v])=>`<option value="${k}" ${splitFilter===k?'selected':''}>${v}</option>`).join('')}</select><span class="muted">${rr.length} 条</span></div><div class="grid" style="margin-top:18px"><section class="panel list">${rr.map(x=>`<button class="item ${x.record_id===selected?'selected':''}" data-id="${x.record_id}">${esc(x.episode_title)}<br><small>${esc(x.show_title)} · ${names[x.split]} · ${x.annotation?'已标注':'待标注'}</small></button>`).join('')}</section><section class="panel" id="detail"></section></div>`;$('#search').onchange=e=>{filter=e.target.value;annotation()};$('#split').onchange=e=>{splitFilter=e.target.value;annotation()};document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{selected=b.dataset.id;annotation()});if(!r){$('#detail').textContent='没有匹配内容';return}detail(r)}
function detail(r){let a=r.annotation||{},t=state.taxonomy;$('#detail').innerHTML=`<span class="badge">${names[r.split]}</span><h3>${esc(r.episode_title)}</h3>${r.episode_title==='Untitled Episode'?'<div class="warn">来源未提供有效标题，请核对原文；不要补猜标题或直接裁决。</div>':''}${r.clean.text.length<80?'<div class="warn">可用简介不足80字，建议保留待复核。</div>':''}<details><summary>来源与清洗记录</summary><p>${esc(r.show_title)} · ${esc(r.published_at_raw)}</p><p>采集时间 ${esc(r.collected_at_utc)}</p><p><a href="${esc(/^https?:/.test(r.episode_url||'')?r.episode_url:'#')}" target="_blank" rel="noreferrer">打开来源</a></p><p>${esc(r.clean.flags.join('；'))}</p><pre>${esc(JSON.stringify(r.clean.removed,null,2))}</pre><details><summary>采集原文</summary><pre>${esc(r.description_text)}</pre></details></details><label for="text">用于判断的简介（可修正，修正会随标注保存）</label><textarea id="text">${esc(a.input_text??r.clean.text)}</textarea><h4>主要主题 · 最多 3 个</h4>${t.topics.map(x=>`<label class="inline"><input type="checkbox" name="topic" value="${x.id}" ${(a.topics||[]).includes(x.id)?'checked':''}> ${esc(x.name)}</label><input class="evidence" type="text" id="ev-${x.id}" aria-label="${esc(x.name)}原文依据" placeholder="选中该主题时，粘贴标题或简介中的原文依据" value="${esc(a.evidence?.[x.id]||'')}">`).join('')}<label for="format">节目形式</label><select id="format">${t.formats.map(x=>`<option value="${x.id}" ${(a.format||'unknown')===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select><input class="evidence" type="text" id="ev-format" aria-label="形式依据" placeholder="形式依据；无法判断可留空" value="${esc(a.evidence?.format||'')}"><label for="reviewer">审核者代号</label><input id="reviewer" type="text" value="${esc(a.reviewer||'')}" placeholder="例如 reviewer-01"><label for="note">判断说明 / 争议与缺失信息</label><textarea id="note" style="min-height:80px">${esc(a.note||'')}</textarea><label><input type="checkbox" id="needs" ${a.needs_review!==false?'checked':''}> 仍需复核（勾选时不计入质量评分）</label><button class="primary" id="save">保存人工参考</button><p class="muted">先完成试标，再看规则建议，避免机器建议影响独立判断。</p>`;$('#save').onclick=async()=>{try{let topics=[...document.querySelectorAll('[name=topic]:checked')].map(x=>x.value),evidence={format:$('#ev-format').value};topics.forEach(k=>evidence[k]=$('#ev-'+k).value);await api('annotation',{id:r.record_id,revision:r.revision,topics,format:$('#format').value,evidence,input_text:$('#text').value,reviewer:$('#reviewer').value,note:$('#note').value,needs_review:$('#needs').checked});await load();toast('人工参考已保存，历史实验保持原有快照')}catch(e){toast(e.message)}}}
function pct(v,refs){return v===null||v===undefined?(refs?'不可计算':'待人工参考'):(v*100).toFixed(1)+'%'}
function experiments(){$('#main').innerHTML=head('策略对比','先用离线规则检查流程，再接模型。规则 A/B 与模型 Prompt A/B 是两类独立实验。')+`<section class="panel"><h3>离线规则实验</h3><p>A：关键词命中；B：标题命中或多个句子命中。两者都可能误判，没有预设优胜策略。</p><div class="actions"><select id="esplit" aria-label="实验分组"><option value="pilot">试标集</option><option value="dev">开发集</option><option value="test">留出测试集</option></select><button class="primary" id="run">运行规则 A/B</button><button id="export">导出当前实验 JSON</button></div><div class="warn">这里仅运行离线规则。真实模型请进入“模型实验”。实验保存当前输入、参考和规则版本；后续标注不会回填历史分数。</div></section><section class="panel" style="margin-top:20px"><h3>实验记录</h3>${state.stats.experiment_list.map(x=>`<button class="item" data-exp="${x.id}">${esc(x.name)} · ${names[x.split]} · ${x.count} 条 · ${esc(x.status)}<br><small>${esc(x.created_at)} · ${x.differences} 条策略分歧 · ${x.error_count} 次输出错误</small></button>`).join('')||'<p>尚未运行实验</p>'}<div id="expdetail"></div></section>`;$('#run').onclick=async()=>{try{$('#run').disabled=true;exp=await api('experiment',{split:$('#esplit').value});await load();toast('规则实验完成，未调用模型')}catch(e){toast(e.message);$('#run').disabled=false}};document.querySelectorAll('[data-exp]').forEach(b=>b.onclick=async()=>{exp=await api('experiment/'+b.dataset.exp);showExp()});$('#export').onclick=()=>{if(!exp)return toast('请先打开一条实验');let blob=new Blob([JSON.stringify(exp,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='TagLab-'+exp.id+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};if(exp)showExp()}
function showExp(){if(!$('#expdetail'))return;$('#expdetail').innerHTML=`<h3 style="margin-top:25px">${esc(exp.name)} · ${exp.id}</h3>${exp.fatal_error?`<div class="warn">${esc(exp.fatal_error)}</div>`:''}<p>状态：${esc(exp.status)} · 输出错误：${exp.error_count} 次 · 合规输出：${exp.rows.reduce((n,r)=>n+Object.values(r.predictions).filter(p=>p.output).length,0)} / ${exp.count*2}</p>${exp.error_count?'<div class="warn">校验失败的输出按未命中计入端到端指标；不能把这些分数单独解释为模型的内容理解能力。展开样本查看具体错误与保留的拒绝输出。</div>':''}<table><tr><th>指标</th><th>A</th><th>B</th></tr>${[['主题 micro F1','f1'],['节目形式准确率','format_accuracy'],['全部标签完全匹配','exact_match']].map(([n,k])=>`<tr><td>${n}</td><td>${pct(exp.metrics.A?.[k],exp.metrics.A?.reference_count)}</td><td>${pct(exp.metrics.B?.[k],exp.metrics.B?.reference_count)}</td></tr>`).join('')}</table><p class="muted">人工有效参考 ${exp.metrics.A?.reference_count||0} 条；差异不代表好坏。${exp.kind==='rules'?'本次为离线规则建议。':'本次为真实模型输出；是否正确需人工裁决。'}</p>${exp.rows.map(x=>`<details><summary>${esc(x.title)} · ${x.reference?'有人工参考':'待人工参考'}</summary><pre>${esc(JSON.stringify({reference:x.reference,predictions:x.predictions},null,2))}</pre></details>`).join('')}`}
function guide(){let t=state.taxonomy;$('#main').innerHTML=head('标签规范与验收','先确认什么算正确，再讨论模型是否更好。')+`<section class="panel"><span class="badge">${esc(t.version)}</span><p>${esc(t.status)}</p><table><tr><th>主题</th><th>定义</th><th>边界反例</th></tr>${t.topics.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.definition)}</td><td>${esc(x.exclude)}</td></tr>`).join('')}</table><h3 style="margin-top:24px">节目形式</h3>${t.formats.map(x=>`<p><strong>${esc(x.name)}</strong>：${esc(x.definition)}</p>`).join('')}<h3>标注规则</h3><ul>${t.rules.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><div class="warn">标题与简介只能支持文字分类，不足以评判音频内容。来源节目名不进入规则分类输入。原文引用校验不等于语义已核实。</div><h3>留出集锁定</h3><p>全部留出样本完成人工参考且无待复核项后才能锁定。锁定后不能改这些参考与输入。当前：${state.stats.test_locked?'已锁定':'未锁定'}</p><button id="lock">锁定留出测试集</button></section>`;$('#lock').onclick=async()=>{if(!confirm('锁定后不能修改留出集参考。确认规范已完成？'))return;try{await api('lock',{});await load()}catch(e){toast(e.message)}}}

async function model(){let c=await api('config');$('#main').innerHTML=head('模型实验','同一批输入，对比基础提示词与带标签规范的提示词。不会把机器建议写成人工参考。')+`<section class="panel"><h3>百炼北京 · 会话内配置</h3><p>配置仅保存在本地服务内存，重启后需要重新填写。不会回显密钥。</p><label for="endpoint">官方接口完整地址</label><input type="text" id="endpoint" style="width:100%" value="${esc(c.endpoint)}"><label for="modelid">模型ID（请选你账户仍有额度的模型）</label><input type="text" id="modelid" value="${esc(c.model)}"><label for="key">API Key</label><input type="password" id="key" autocomplete="off" style="padding:8px;border:1px solid #ccd6e5;border-radius:6px"><div class="actions"><button id="configsave">使用此配置</button><span id="cfgstatus">${c.configured?'已配置，尚未验证连接':'待配置'}</span></div><div class="warn">运行时会把所选样本的标题和清洗简介发送至上述百炼接口，并消耗该账户额度。不发送节目名、人工标签或原始RSS。额度是否免费以你的百炼账户为准。</div><label for="msplit">实验分组</label><select id="msplit"><option value="pilot">试标集</option><option value="dev">开发集</option><option value="test">留出测试集</option></select><label for="limit">样本数（每条分别调用A/B两次）</label><input id="limit" type="number" min="1" max="20" value="2"><div class="actions"><button class="primary" id="mrun">发起模型 A/B</button><span id="jobstatus" role="status"></span></div><p class="muted">不自动重试。权限、额度、限流或连接错误会停止后续调用。首次建议2条，共4次请求。</p></section>`;
$('#configsave').onclick=async()=>{try{await api('config',{endpoint:$('#endpoint').value,model:$('#modelid').value,key:$('#key').value});$('#key').value='';$('#cfgstatus').textContent='已配置，尚未验证连接';toast('配置仅保留在服务内存')}catch(e){toast(e.message)}};
$('#mrun').onclick=async()=>{let limit=Number($('#limit').value);if(!Number.isInteger(limit)||limit<1||limit>20)return toast('样本数须为1–20');if(!confirm(`即将发送 ${limit} 条公开文字样本到百炼，最多 ${limit*2} 次模型请求。确认运行？`))return;try{let job=await api('model-experiment',{split:$('#msplit').value,limit});$('#mrun').disabled=true;$('#jobstatus').textContent='运行中，可以切换页面；不要关闭本地服务。';let timer=setInterval(async()=>{try{let j=await api('job/'+job.job_id);if(j.status==='running')return;clearInterval(timer);state=await api('state');if(j.experiment_id){exp=await api('experiment/'+j.experiment_id);view='experiments';render();toast('实验已结束，请查看状态与错误记录')}else toast(j.error||'实验结束');}catch(e){clearInterval(timer);toast(e.message)}},2000)}catch(e){toast(e.message)}}
}

document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;render()});load().catch(e=>toast(e.message));
</script></html>
